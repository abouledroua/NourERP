<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Al-Nour ERP Splash Screen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #0b1d3a, #060e1d);
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
    }
    .logo-container {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      background: linear-gradient(135deg, #10b981, #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.35);
      margin-bottom: 20px;
      animation: pulse 2.5s infinite;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #f8fafc;
      text-align: center;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 30px;
    }
    .loader-bar {
      width: 280px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 9999px;
      position: absolute;
      animation: slide 1.5s infinite ease-in-out;
    }
    .status-text {
      font-size: 11px;
      color: #10b981;
      margin-top: 14px;
      font-weight: 600;
    }
    @keyframes slide {
      0% { left: -40%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="logo-container">ن</div>
  <h1>نظام النور الأكاديمي والإداري للمدارس</h1>
  <p>Al-Nour Academic & School ERP Platform</p>
  
  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>

  <div class="status-text" id="status-label">جارٍ التحقق من قاعدة البيانات وتشغيل الخادم...</div>
</body>
</html>
